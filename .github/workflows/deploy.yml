name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: composer install --no-dev --no-interaction --no-progress --no-autoloader
      - name: Upload per SFTP
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASS }}
          KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          lftp -c "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            open -u \"$USER\",\"$PASS\" sftp://$HOST;
            mirror -R --verbose \
              --exclude-glob .git* --exclude .github/ \
              ./public/ /www/;
            mirror -R --delete --verbose \
              ./vendor/phpmailer/phpmailer/src/ /PHPMailer/"
