name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test generator
        run: node --test scripts/project-pages/test/*.test.mjs

      - name: Check links
        run: node scripts/project-pages/check.mjs
