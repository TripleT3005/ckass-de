<script>
(function(){
  var h = document.getElementById("name"), txt = h.textContent;
  h.textContent = ""; h.setAttribute("aria-label", txt);
  var sp = [].map.call(txt, function(c){ var s = document.createElement("span"); s.textContent = c; s.setAttribute("aria-hidden","true"); h.appendChild(s); return s; });
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var px = null, py = null, t0 = performance.now();
  function frame(now){
    var t = (now - t0) / 1000;
    for (var i = 0; i < sp.length; i++){
      var r = sp[i].getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      var w = 520 + 160 * Math.sin(t * 0.9 - i * 0.7);
      var near = 0;
      if (px !== null){ var d = Math.hypot(px - cx, py - cy); near = Math.max(0, 1 - d / 150); w += 400 * near; }

      sp[i].classList.toggle("hot", near > .55);
    }
    requestAnimationFrame(frame);
  }
  addEventListener("pointermove", function(e){ px = e.clientX; py = e.clientY; });
  function off(){ px = py = null; }
  document.documentElement.addEventListener("pointerleave", off);
  addEventListener("pointercancel", off);
  addEventListener("blur", off);
  addEventListener("pointerup", function(e){ if (e.pointerType !== "mouse") off(); });
  if (still){ sp.forEach(function(s){ s.style.fontWeight = 600; }); }
  else requestAnimationFrame(frame);
})();
