<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>404</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#F3F4F1;--ink:#1B2B23;--muted:#6B7A72;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--ink:#E5EAE6;--muted:#8A9A91;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 1.5rem;text-align:center}
h1{margin:0;font-size:clamp(2.75rem,9vw,4.5rem);line-height:1;letter-spacing:-.03em;font-weight:400}
p{margin:.75rem 0 0;color:var(--muted)}
a.home{margin-top:2rem;padding:.6rem 1.4rem;border:1px solid var(--muted);border-radius:999px;color:var(--ink);text-decoration:none;transition:background .2s,color .2s,border-color .2s}
a.home:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
a.home:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){a.home{transition:none}}
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p><span lang="de">nicht gefunden</span> · <span lang="en">not found</span></p>
  <a class="home" href="/"><span lang="de">Zu ckass.de</span> · <span lang="en">Go to ckass.de</span></a>
</main>
</body>
</html>
