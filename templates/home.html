.projects{display:flex;flex-direction:column;align-items:flex-start;gap:.6rem;margin:1.75rem 0 0;padding:0;list-style:none}
.projects a{display:inline-flex;align-items:center;gap:.5rem;color:var(--muted);text-decoration:none;transition:color .2s}
.projects a:hover{color:var(--ink)}
.projects a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:.25rem}
.projects img{width:1.5rem;height:1.5rem}
.legal{padding:0 1.5rem 1.5rem;text-align:center;color:var(--muted);font-size:.875rem}
.legal a{color:inherit;text-decoration:none}
.legal a:hover{color:var(--ink);text-decoration:underline}
.legal a:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:.25rem}

#motion-notice p{margin:0}
#motion-notice button{min-height:2.75rem;padding:.5rem .85rem;border:1px solid currentColor;border-radius:999px;background:transparent;color:inherit;font:inherit;cursor:pointer}
#motion-notice button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (prefers-reduced-motion:reduce){h1 span,nav a,.projects a{transition:none}}
.switch{position:fixed;top:max(1rem,env(safe-area-inset-top,0px));right:max(1rem,env(safe-area-inset-right,0px));margin:0}
{{switchStyle}}
</style>
